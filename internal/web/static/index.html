<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>orquestalite · durable workflows</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background:#0b1020; color:#e7ebf3 }
    body { max-width:1200px; margin:0 auto; padding:28px }
    header { display:flex; align-items:baseline; justify-content:space-between; gap:20px }
    h1 { font-size:22px; margin:0 } h2 { font-size:14px; color:#98a4bc; text-transform:uppercase; letter-spacing:.08em }
    .pill { border:1px solid #33405a; border-radius:999px; padding:5px 10px; font-size:12px }
    .ok { color:#68d391 } .error { color:#fc8181 } .warn { color:#f6c85f }
    section { margin-top:28px; background:#11182a; border:1px solid #263149; border-radius:12px; padding:18px }
    table { width:100%; border-collapse:collapse; font-size:12px } th,td { padding:10px 8px; border-bottom:1px solid #263149; text-align:left; vertical-align:top }
    th { color:#98a4bc } code { color:#9dd6ff } .empty { color:#748099; padding:12px 0 }
    #events { max-height:260px; overflow:auto; white-space:pre-wrap; color:#aab5cb; font-size:11px }
  </style>
</head>
<body>
  <header><h1>orquestalite <span class="warn">v2</span></h1><span id="health" class="pill">checking setup…</span></header>
  <section><h2>Durable workflow runs</h2><div id="runs" class="empty">loading…</div></section>
  <section><h2>Installed flow catalog</h2><div id="flows" class="empty">loading…</div></section>
  <section><h2>Live runtime events</h2><div id="events"></div></section>
  <script>
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const table = (headers, rows) => rows.length ? `<table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table>` : '<div class="empty">none</div>';
    async function refresh() {
      const [doctor, workflows, flows] = await Promise.all(['/api/doctor','/api/workflows','/api/flows'].map(path=>fetch(path).then(r=>r.json())));
      const health = document.querySelector('#health'); health.textContent = doctor.ok ? 'setup ready' : 'setup needs attention'; health.className = `pill ${doctor.ok?'ok':'error'}`;
      document.querySelector('#runs').innerHTML = table(['run','status','flow','updated','error'], (workflows.workflows||[]).map(run=>[run.id,run.status,run.flow_ref,run.updated_at,run.error]));
      document.querySelector('#flows').innerHTML = table(['flow','pack','roles','inputs'], (flows.flows||[]).map(flow=>[flow.name,flow.pack,flow.roles.join(', '),Object.keys(flow.inputs).join(', ')]));
    }
    refresh().catch(error => { document.querySelector('#health').textContent = error.message; document.querySelector('#health').className='pill error'; });
    setInterval(refresh, 3000);
    const events = document.querySelector('#events');
    new EventSource('/api/events').onmessage = event => { events.textContent += event.data+'\n'; events.scrollTop = events.scrollHeight; };
  </script>
</body>
</html>
